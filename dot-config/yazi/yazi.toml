[[plugin.prepend_fetchers]]
id = "git"
url = "*/"
run = "git"

[mgr]
show_hidden = true
sort_by = "mtime"
sort_reverse = true         # newest files first
sort_dir_first = true       # folders before files
linemode = "size_and_mtime" # cf. init.lua

[plugin]
prepend_previewers = [
  { url = "*.nc", run = 'piper -- ncdump -h "$1"' },
  { url = "*.nc4", run = 'piper -- ncdump -h "$1"' },
]

[opener]
acrobat = [
  { run = 'open -a "/Applications/Adobe Acrobat Reader.app/Contents/MacOS/AdobeReader" "$@"', orphan = true, desc = "Adobe Acrobat" },
]
powerpoint = [
  { run = 'open -a "Microsoft PowerPoint" "$@"', orphan = true, desc = "PowerPoint" },
]
word = [{ run = 'open -a "Microsoft Word" "$@"', orphan = true, desc = "Word" }]

[[open.rules]]
mime = "application/pdf"
use = ["open", "acrobat"]

[[open.prepend_rules]]
url = "*.pptx"
use = "powerpoint"

[[open.prepend_rules]]
url = "*.ppt"
use = "powerpoint"

[[open.prepend_rules]]
url = "*.docx"
use = "word"

[[open.prepend_rules]]
url = "*.doc"
use = "word"
