[[mgr.prepend_keymap]]
on = "<C-g>"
run = 'shell -- rofi -theme fullscreen-preview -show filebrowser -filebrowser-command "ya emit reveal" -filebrowser-directory "$(pwd)"'
desc = "Grid view"

[[mgr.prepend_keymap]]
on = "l"
run = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on = "f"
run = "plugin jump-to-char"
desc = "Jump to char"

[[mgr.prepend_keymap]]
on = ["c", "m"]
run = "plugin chmod"
desc = "Chmod on selected files"

[[mgr.prepend_keymap]]
on = "+"
run = "plugin zoom 1"
desc = "Zoom in hovered file"

[[mgr.prepend_keymap]]
on = "-"
run = "plugin zoom -1"
desc = "Zoom out hovered file"

[[mgr.prepend_keymap]]
on = "K"
run = "plugin parent-arrow -1"

[[mgr.prepend_keymap]]
on = "J"
run = "plugin parent-arrow 1"

[[mgr.prepend_keymap]]
on = "<M>"
run = '''shell --
paths=""
for p in $(echo "%s"); do
    abs=$(realpath "$p")
    echo "ABS=$abs" >> /Users/arsouze/debug.txt

    if [ -z "$paths" ]; then
        paths="file://$abs"
    else
        paths="$paths,file://$abs"
    fi
done
/Applications/Thunderbird.app/Contents/MacOS/thunderbird \
    -compose "attachment='$paths'"
'''
desc = "Send a mail with selected files in attachment"

[[mgr.prepend_keymap]]
on = ["t", "t"]
run = "plugin smart-tab"
desc = "Create a tab and enter the hovered directory"
